# 推荐的 HTTP 持久化配置示例。
# 客户端请求通过解析后，会在一个本地事务中写入全部 output 队列。
# 空间不足的 output 会先淘汰最老记录，再保留最新记录；事务提交后返回 204。
# 每个 output 由独立 FIFO worker 异步投递，一个远端故障不会阻塞其他 output。

[[http]]
# name：relay 唯一名称，用于日志；也参与未配置 queue-path 时的默认文件名生成。
name = "example-http"

# bind-addr：HTTP 监听地址，格式为 "IP:端口"。
bind-addr = "127.0.0.1:9096"

# queue-path：该 HTTP relay 的 BoltDB WAL 文件。
# 文件以 0600 权限打开，保存正文、查询参数和 Authorization header。
# 目录必须可由运行用户写入，且一个文件只能由一个 relay 进程使用。
queue-path = "/var/lib/influxdb-relay/example-http.queue.db"

# 可选：客户端没有传 rp 时补充默认保留策略；不会覆盖已有 rp。
# default-retention-policy = "autogen"

# 可选：配置包含证书和私钥的 PEM 文件后启用 HTTPS。
# ssl-combined-pem = "/etc/influxdb-relay/server.pem"

# 持久化模式要求列表中每个 output 的 buffer-size-mb 都为正数。
# 入队会在一个 BoltDB 事务中写入所有 output；空间不足时静默淘汰最老的待投递记录。
#
# output 字段含义：
#   name：output 唯一名称，也是持久化 bucket 标识；存在积压时不要修改。
#   location：完整的远端 /write URL。
#   timeout：每次远端请求的超时，默认 10s。它不阻塞其他 output 或客户端 ACK。
#   buffer-size-mb：该 output 活动队列的逻辑目标容量；空间不足时从队首淘汰。
#                   dead-letter 另有同等上限，因此磁盘至少按所有该值之和的 2 倍规划。
#   max-batch-kb：worker 按相同查询参数和认证信息合并正文的上限，默认 512KB。
#                 adaptive-batch=true 时作为自适应上限；单条记录不会拆分，可能超过此值。
#   adaptive-batch：是否根据该 output 的写入耗时和吞吐量自适应批量，默认 false。
#                   各 output 独立学习；可重试错误立即减半，链路恢复后最多逐次增长 25%。
#   min-batch-kb：自适应批量下限，默认 128KB，不能大于 max-batch-kb。
#                 小于此值的零散成功请求不参与带宽估算，避免误判网络拥堵。
#   target-batch-duration：期望一次 HTTP 写入完成的时间，默认 5s。
#                          控制器按平滑吞吐量估算合适批量；值越小越保守，且必须小于 timeout。
#   max-delay-interval：可重试错误的指数退避上限，默认 10s；实际等待包含随机抖动。
#   skip-tls-verification：跳过 TLS 证书校验，默认 false；仅限可信测试环境使用。
output = [
    { name="local1", location="http://127.0.0.1:8086/write", timeout="10s", buffer-size-mb=100, max-batch-kb=512, max-delay-interval="5s", skip-tls-verification=false },
    { name="local2", location="http://127.0.0.1:7086/write", timeout="30s", buffer-size-mb=100, max-batch-kb=2048, adaptive-batch=true, min-batch-kb=128, target-batch-duration="5s", max-delay-interval="5s", skip-tls-verification=false },
]

# 重试分类：网络错误、HTTP 408、425、429 和 5xx 会指数退避重试。
# 其他非 2xx 响应会移入该 output 的有界 dead-letter，避免错误数据永久堵住队首。
# 投递保证为 at-least-once：远端成功后、WAL 删除前若进程崩溃，重启后可能重放。
# 注意：故障持续过久时，最老的待投递数据会被永久淘汰；如要求全部保留，必须及时扩容。
# 单条记录大于容量时会清空旧记录，并把该最新记录作为唯一记录保留。
